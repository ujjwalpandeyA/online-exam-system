# Server Configuration
server.port=8081

# Application Name
spring.application.name=online-exam-system

# PostgreSQL Database Configuration
# Format: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/online_exam_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# update: Updates the schema if entities change, creates tables if they don't exist
spring.jpa.hibernate.ddl-auto=update

# Prints raw SQL statements in the console
spring.jpa.show-sql=true

# Formats SQL statements cleanly on multiple lines
spring.jpa.properties.hibernate.format_sql=true

# Specifies PostgreSQL dialect for Hibernate 6
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# ========================================================
# Google Gemini AI Configuration (Spring AI)
# ========================================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.ai.google.genai.chat.options.temperature=0.7

# ========================================================
# Connection & Read Timeouts for Long-Running AI Calls
# ========================================================
# Allow up to 60 seconds for Gemini to generate complex JSON responses
spring.ai.google.genai.chat.options.timeout=60s

# Prevent Tomcat from prematurely dropping active client connections
server.tomcat.connection-timeout=60000