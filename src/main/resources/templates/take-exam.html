<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .question-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            background: #fff;
        }
        .option-label {
            display: block;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }
        .option-label:hover {
            background-color: #f1f5f9;
            border-color: #0d6efd;
        }
        .form-check-input:checked + .option-text {
            font-weight: 600;
            color: #0d6efd;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-4 py-3 shadow-sm">
    <span class="navbar-brand mb-0 h1 fw-bold" id="examHeading">Exam Assessment</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm fw-semibold">Exit to Dashboard</a>
</nav>

<div class="container py-5" style="max-width: 860px;">
    <!-- Alert Box -->
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <!-- Spinner -->
    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Loading questions...</p>
    </div>

    <!-- Questions Form -->
    <form id="examForm" class="d-none">
        <div id="questionsContainer" class="d-flex flex-column gap-4"></div>

        <div class="d-flex justify-content-end mt-4 pt-3 border-top">
            <button type="submit" id="submitBtn" class="btn btn-success btn-lg px-5 fw-bold shadow-sm">Submit Exam</button>
        </div>
    </form>
</div>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) {
        window.location.href = '/login';
    }

    // Extract exam ID from current URL (/exam/{id})
    const pathParts = window.location.pathname.split('/');
    const examId = pathParts[pathParts.length - 1];

    let questionsList = [];

    async function loadExam() {
        const spinner = document.getElementById('loadingSpinner');
        const form = document.getElementById('examForm');
        const container = document.getElementById('questionsContainer');
        const alertBox = document.getElementById('alertBox');

        try {
            // 1. Fetch exam details
            const examRes = await fetch(`/api/v1/exams/${examId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!examRes.ok) throw new Error('Could not load exam details.');
            const examData = await examRes.json();
            document.getElementById('examHeading').innerText = examData.title;

            // 2. Fetch questions
            let questionsRes = await fetch(`/api/v1/questions/exam/${examId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (questionsRes.ok) {
                questionsList = await questionsRes.json();
            } else if (examData.questions && examData.questions.length > 0) {
                questionsList = examData.questions;
            } else {
                throw new Error('No questions found for this exam.');
            }

            if (!questionsList || questionsList.length === 0) {
                throw new Error('This exam has no questions available.');
            }

            // Render Questions
            container.innerHTML = '';
            questionsList.forEach((q, index) => {
                const qCard = document.createElement('div');
                qCard.className = 'card question-card p-4';

                let optionsHtml = '';
                if (q.options) {
                    q.options.forEach(opt => {
                        optionsHtml += `
                            <label class="option-label mb-2">
                                <div class="form-check m-0">
                                    <input class="form-check-input" type="radio" 
                                           name="question_${q.id}" 
                                           value="${opt.id}" 
                                           data-question-id="${q.id}">
                                    <span class="option-text ms-2">${opt.optionText}</span>
                                </div>
                            </label>
                        `;
                    });
                }

                qCard.innerHTML = `
                    <div class="d-flex justify-content-between mb-3">
                        <h5 class="fw-bold mb-0">Question ${index + 1}</h5>
                        <span class="badge bg-secondary">${q.marks || 1} Marks</span>
                    </div>
                    <p class="fs-5 text-dark mb-4">${q.content}</p>
                    <div class="options-group">${optionsHtml}</div>
                `;
                container.appendChild(qCard);
            });

            spinner.classList.add('d-none');
            form.classList.remove('d-none');

        } catch (err) {
            spinner.classList.add('d-none');
            alertBox.className = 'alert alert-danger';
            alertBox.innerText = err.message;
            alertBox.classList.remove('d-none');
        }
    }

    // Submit Exam Form
    document.getElementById('examForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        if (!confirm('Are you sure you want to submit your answers?')) return;

        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Submitting...';

        const answers = [];
        questionsList.forEach(q => {
            const selectedRadio = document.querySelector(`input[name="question_${q.id}"]:checked`);
            if (selectedRadio) {
                answers.push({
                    questionId: q.id,
                    selectedOptionId: parseInt(selectedRadio.value)
                });
            }
        });

        try {
            const res = await fetch(`/api/v1/submissions/exam/${examId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ answers: answers })
            });

            const resultData = await res.json();

            if (!res.ok) {
                throw new Error(resultData.message || 'Submission failed.');
            }

            const resultId = resultData.resultId || resultData.id;
            window.location.href = `/result/${resultId}`;

        } catch (err) {
            alertBox.className = 'alert alert-danger';
            alertBox.innerText = err.message;
            alertBox.classList.remove('d-none');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit Exam';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    document.addEventListener('DOMContentLoaded', loadExam);
</script>

</body>
</html>
