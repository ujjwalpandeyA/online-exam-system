<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Result - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .score-card {
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            background: #fff;
        }
        .correct-box {
            background-color: #e8f5e9;
            border-left: 5px solid #28a745;
        }
        .incorrect-box {
            background-color: #ffebee;
            border-left: 5px solid #dc3545;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-4 py-3 shadow-sm">
    <span class="navbar-brand mb-0 h1 fw-bold">Assessment Scorecard</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm fw-semibold">Back to Dashboard</a>
</nav>

<div class="container py-5" style="max-width: 860px;">
    <!-- Spinner -->
    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Loading scorecard...</p>
    </div>

    <!-- Score Summary Card -->
    <div id="resultContent" class="d-none">
        <div class="card score-card p-4 mb-4 text-center">
            <h2 class="fw-bold mb-1" id="examTitle">Exam Result</h2>
            <p class="text-muted" id="studentName">Student</p>
            
            <div class="my-3">
                <span id="passBadge" class="badge fs-5 px-4 py-2"></span>
            </div>

            <h1 class="display-4 fw-bold text-primary my-2" id="scoreDisplay">0 / 0</h1>
            <p class="text-muted mb-0">Total Score</p>
        </div>

        <h4 class="fw-bold mb-3">Question Breakdown & Review</h4>
        <div id="breakdownContainer" class="d-flex flex-column gap-3"></div>
    </div>
</div>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/login';

    const pathParts = window.location.pathname.split('/');
    const resultId = pathParts[pathParts.length - 1];

    async function loadResult() {
        const spinner = document.getElementById('loadingSpinner');
        const content = document.getElementById('resultContent');
        const breakdown = document.getElementById('breakdownContainer');

        try {
            const res = await fetch(`/api/v1/submissions/${resultId}/review`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error('Could not load test review.');
            const data = await res.json();

            document.getElementById('examTitle').innerText = data.examTitle;
            document.getElementById('studentName').innerText = `Examinee: ${data.studentName}`;
            document.getElementById('scoreDisplay').innerText = `${data.marksObtained} / ${data.totalMarks}`;

            const badge = document.getElementById('passBadge');
            if (data.passed) {
                badge.className = 'badge bg-success fs-5 px-4 py-2';
                badge.innerText = 'PASSED';
            } else {
                badge.className = 'badge bg-danger fs-5 px-4 py-2';
                badge.innerText = 'FAILED';
            }

            breakdown.innerHTML = '';
            if (data.questionReviews) {
                data.questionReviews.forEach((qr, idx) => {
                    const card = document.createElement('div');
                    card.className = `p-4 rounded shadow-sm ${qr.isCorrect ? 'correct-box' : 'incorrect-box'}`;
                    card.innerHTML = `
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fw-bold">Q${idx + 1}. ${qr.questionContent}</span>
                            <span class="badge ${qr.isCorrect ? 'bg-success' : 'bg-danger'}">${qr.marks} Marks</span>
                        </div>
                        <div class="small mt-2">
                            <p class="mb-1"><strong>Your Selection:</strong> <span class="${qr.isCorrect ? 'text-success fw-bold' : 'text-danger fw-bold'}">${qr.selectedOptionText}</span></p>
                            ${!qr.isCorrect ? `<p class="mb-0 text-success"><strong>Correct Answer:</strong> ${qr.correctOptionText}</p>` : ''}
                        </div>
                    `;
                    breakdown.appendChild(card);
                });
            }

            spinner.classList.add('d-none');
            content.classList.remove('d-none');

        } catch (err) {
            spinner.classList.add('d-none');
            alert(err.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadResult);
</script>

</body>
</html>
