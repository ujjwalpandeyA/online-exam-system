<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-3 fw-bold text-primary">Exam Portal</h3>
    <p class="text-center text-muted mb-4">Enter your credentials to continue</p>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. rohit_student" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
		
		<div class="text-center mt-3 small">
		            <span class="text-muted">Don't have an account?</span>
		            <a href="/register" class="text-primary text-decoration-none fw-semibold ms-1">Create Account</a>
		        </div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const loginBtn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alertBox');
        
        loginBtn.disabled = true;
        loginBtn.innerText = "Authenticating...";
        alertBox.classList.add('d-none');

        const usernameVal = document.getElementById('username').value.trim();
        const passwordVal = document.getElementById('password').value;

        // Provide both 'username' and 'usernameOrEmail' to match any DTO format
        const payload = {
            username: usernameVal,
            usernameOrEmail: usernameVal,
            password: passwordVal
        };

        try {
            console.log("Sending login request with payload:", payload);

            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            console.log("Server response status:", response.status);
            console.log("Server response body:", data);

            // Accept accessToken, token, or jwt
            const token = data.accessToken || data.token || data.jwt || data.jwtToken;

            if (response.ok && token) {
                localStorage.setItem('accessToken', token);
                localStorage.setItem('username', data.username || usernameVal);
                if (data.roles) {
                    localStorage.setItem('roles', JSON.stringify(data.roles));
                }

                alertBox.className = "alert alert-success";
                alertBox.innerText = "Login successful! Redirecting...";
                alertBox.classList.remove('d-none');

				setTimeout(() => {
				                    const rolesArray = data.roles || [];
				                    if (rolesArray.includes('ROLE_TEACHER')) {
				                        window.location.href = '/teacher-dashboard';
				                    } else {
				                        window.location.href = '/dashboard';
				                    }
				                }, 800);
            } else {
                const errorMsg = data.message || data.error || (response.status === 401 ? 'Invalid credentials' : 'Login failed');
                throw new Error(errorMsg);
            }
        } catch (err) {
            console.error("Login error caught:", err);
            alertBox.className = "alert alert-danger";
            alertBox.innerText = err.message;
            alertBox.classList.remove('d-none');
            loginBtn.disabled = false;
            loginBtn.innerText = "Sign In";
        }
    });
</script>

</body>
</html>
