<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 2.2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center mb-2 fw-bold text-primary">Create Account</h3>
    <p class="text-center text-muted mb-4">Register as a student to take assessments</p>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label for="fullName" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="fullName" placeholder="e.g. Amit Kumar" required>
        </div>

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" placeholder="e.g. amit_student" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="amit@mail.com" required>
        </div>
		
		<div class="mb-3">
		            <label for="role" class="form-label fw-semibold">Register As</label>
		            <select class="form-select" id="role" required>
		                <option value="ROLE_STUDENT" selected>Student (Takes Assessments)</option>
		                <option value="ROLE_TEACHER">Teacher / Instructor (Creates Assessments)</option>
		            </select>
		        </div>

        <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">Register</button>

        <div class="text-center mt-3 small">
            <span class="text-muted">Already have an account?</span>
            <a href="/login" class="text-primary text-decoration-none fw-semibold ms-1">Sign In</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        btn.disabled = true;
        btn.innerText = 'Creating account...';
        alertBox.classList.add('d-none');

        const payload = {
            fullName: document.getElementById('fullName').value.trim(),
            username: document.getElementById('username').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
           role: document.getElementById('role').value
        };

        try {
            const res = await fetch('/api/v1/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                alertBox.className = 'alert alert-success';
                alertBox.innerText = 'Registration successful! Redirecting to login...';
                alertBox.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1200);
            } else {
                throw new Error(data.message || 'Registration failed.');
            }
        } catch (err) {
            alertBox.className = 'alert alert-danger';
            alertBox.innerText = err.message;
            alertBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerText = 'Register';
        }
    });
</script>

</body>
</html>
