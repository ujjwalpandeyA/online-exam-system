<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Online Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .rank-badge {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }
        .rank-1 { background-color: #ffd700; color: #000; }
        .rank-2 { background-color: #c0c0c0; color: #000; }
        .rank-3 { background-color: #cd7f32; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-4 py-3 shadow-sm">
    <span class="navbar-brand mb-0 h1 fw-bold">Assessment Leaderboard</span>
    <a href="/dashboard" class="btn btn-outline-light btn-sm fw-semibold">Back to Dashboard</a>
</nav>

<div class="container py-5" style="max-width: 900px;">
    <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-4 text-center">Top Performing Students</h4>

        <!-- Spinner -->
        <div id="loadingSpinner" class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Loading ranks...</p>
        </div>

        <!-- Leaderboard Table -->
        <div class="table-responsive d-none" id="tableContainer">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">Rank</th>
                        <th>Student Name</th>
                        <th class="text-center">Marks</th>
                        <th class="text-center">Percentage</th>
                        <th class="text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) window.location.href = '/login';

    const pathParts = window.location.pathname.split('/');
    const examId = pathParts[pathParts.length - 1];

    async function loadLeaderboard() {
        const spinner = document.getElementById('loadingSpinner');
        const container = document.getElementById('tableContainer');
        const tbody = document.getElementById('leaderboardBody');

        try {
            const res = await fetch(`/api/v1/submissions/exam/${examId}/leaderboard`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error('Could not load leaderboard data.');
            const list = await res.json();

            spinner.classList.add('d-none');
            container.classList.remove('d-none');

            if (!list || list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No submissions recorded yet.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            list.forEach(item => {
                let rankClass = '';
                if (item.rank === 1) rankClass = 'rank-1';
                else if (item.rank === 2) rankClass = 'rank-2';
                else if (item.rank === 3) rankClass = 'rank-3';
                else rankClass = 'bg-light text-muted';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="rank-badge ${rankClass}">${item.rank}</span></td>
                    <td class="fw-semibold">${item.studentName}</td>
                    <td class="text-center">${item.marksObtained} / ${item.totalMarks}</td>
                    <td class="text-center">${item.percentage}%</td>
                    <td class="text-center">
                        <span class="badge ${item.passed ? 'bg-success' : 'bg-danger'}">
                            ${item.passed ? 'PASSED' : 'FAILED'}
                        </span>
                    </td>
                `;
                tbody.appendChild(row);
            });
        } catch (err) {
            spinner.classList.add('d-none');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">${err.message}</td></tr>`;
            container.classList.remove('d-none');
        }
    }

    document.addEventListener('DOMContentLoaded', loadLeaderboard);
</script>

</body>
</html>
